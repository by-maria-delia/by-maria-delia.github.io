name: Promote preview to main

# Fires when the editor clicks "Publicar a produccion" in /admin/.
# Fast-forwards main to preview, which in turn triggers the production deploy
# workflow on the new main commit. See docs/handoff-staging-branch.md.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Two clicks land back-to-back: the second sees an empty ff and exits 0.
concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin preview main

          # Self-heal: if main has commits not in preview (e.g. a docs PR landed
          # directly on main), merge main into preview first so the FF below
          # can succeed. Netlify will rebuild preview with the same content
          # plus the main-side commits, which is the correct end state.
          if [ -n "$(git log --oneline origin/preview..origin/main)" ]; then
            echo "main has commits not in preview; auto-merging main into preview"
            git checkout -B preview-sync origin/preview
            git merge origin/main --no-edit \
              -m "Merge main into preview (auto-sync before promote)"
            git push origin preview-sync:preview
            git fetch origin preview
            git checkout main
          fi

          if ! git merge --ff-only origin/preview; then
            echo "::error::main could not fast-forward to preview even after auto-sync. Inspect branch state manually."
            exit 1
          fi
          git push origin main

      # Pushes made by GITHUB_TOKEN do not trigger downstream push-driven
      # workflows. Explicitly dispatch the deploy workflow so the live site
      # actually updates. workflow_dispatch is exempt from the no-recursive
      # -trigger rule.
      - name: Trigger production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
